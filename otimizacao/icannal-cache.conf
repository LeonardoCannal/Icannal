# i.cannal — validade dos arquivos fixos (/static/) entregues pelo nginx.
# Arquivo com "?v=..." no endereço (CSS, ícones) ou fonte: guarda 1 ano no
# navegador — quando o arquivo muda, o "?v=" muda e ele baixa de novo.
# Sem "?v=": guarda 1 hora.
map $arg_v $icannal_cache_estaticos {
    ""      "public, max-age=3600";
    default "public, max-age=31536000, immutable";
}

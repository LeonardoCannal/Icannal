{# Barra de abas no rodapé — só aparece no celular (até 640px), no lugar do
   menu do topo, que não cabia na tela. Uso:
   {% with aba_mobile='agenda' %}{% include '_barra_mobile.html' %}{% endwith %} #}
<style>
  .barra-mobile{ display:none; }
  @media (max-width: 640px){
    header nav{ display:none !important; }
    body{ padding-bottom: calc(66px + env(safe-area-inset-bottom)); overflow-x: clip; }
    nav.barra-mobile{
      display:flex; position:fixed; left:0; right:0; bottom:0; z-index:150;
      width:auto; margin:0; gap:0; border-radius:0; overflow:visible; flex-wrap:nowrap; justify-content:space-around;
      background:#171B22; border-top:1px solid rgba(255,255,255,.08);
      padding:6px 4px calc(6px + env(safe-area-inset-bottom));
      box-shadow:0 -6px 20px rgba(23,27,34,.18);
    }
    nav.barra-mobile a{
      background:none; margin:0; line-height:1.2; letter-spacing:0;
      flex:1; min-width:0; display:flex; flex-direction:column; align-items:center; gap:3px;
      padding:6px 2px; border-radius:12px; text-decoration:none;
      color:rgba(255,255,255,.62); font-family:'Montserrat',sans-serif; font-size:10.5px; font-weight:600;
      -webkit-tap-highlight-color:transparent;
    }
    nav.barra-mobile a svg{ width:22px; height:22px; }
    nav.barra-mobile a span{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
    nav.barra-mobile a.ativo{ color:#A8CC5A; background:none; }
    nav.barra-mobile a:hover{ background:none; }
    nav.barra-mobile a.ativo svg{ background:rgba(136,173,54,.18); border-radius:10px; padding:3px 9px; box-sizing:content-box; margin:-3px 0; }
  }
</style>
<nav class="barra-mobile" aria-label="Menu">
  <a href="{{ url_for('index') }}" data-aba="buscar" class="{{ 'ativo' if aba_mobile == 'buscar' }}">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
    <span>Buscar</span>
  </a>
  <a href="{{ url_for('index') }}#painel" data-aba="painel" class="{{ 'ativo' if aba_mobile == 'painel' }}">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="7" height="16" rx="2"/><rect x="14" y="4" width="7" height="10" rx="2"/></svg>
    <span>Painel</span>
  </a>
  <a href="{{ url_for('agenda') }}" class="{{ 'ativo' if aba_mobile == 'agenda' }}">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>
    <span>Agenda</span>
  </a>
  <a href="{{ url_for('artigos') }}" class="{{ 'ativo' if aba_mobile == 'artigos' }}">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h11l5 5v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z"/><path d="M14 4v5h6M7 13h10M7 17h7"/></svg>
    <span>Artigos</span>
  </a>
  {% if current_user.is_admin %}
  <a href="{{ url_for('admin') }}">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"/></svg>
    <span>Admin</span>
  </a>
  {% endif %}
  <a href="{{ url_for('perfil') }}" class="{{ 'ativo' if aba_mobile == 'perfil' }}">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>
    <span>Perfil</span>
  </a>
</nav>
<script>
  // Na página de busca, "Buscar" e "Painel" só trocam de aba (sem recarregar)
  // e o destaque da barra acompanha a aba aberta.
  (function(){
    const tabBuscar = document.getElementById('tab-buscar');
    const tabPainel = document.getElementById('tab-painel');
    if(!tabBuscar || !tabPainel) return;
    const itens = document.querySelectorAll('.barra-mobile a[data-aba]');
    function sincronizar(){
      const aba = tabPainel.classList.contains('ativo') ? 'painel' : 'buscar';
      itens.forEach(a => a.classList.toggle('ativo', a.dataset.aba === aba));
    }
    itens.forEach(a => a.addEventListener('click', (e) => {
      e.preventDefault();
      (a.dataset.aba === 'painel' ? tabPainel : tabBuscar).click();
      window.scrollTo({ top: 0 });
    }));
    new MutationObserver(sincronizar).observe(tabPainel, { attributes: true, attributeFilter: ['class'] });
    sincronizar();
  })();
</script>

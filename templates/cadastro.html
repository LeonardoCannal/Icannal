<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>i.cannal · Criar conta</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
<meta name="theme-color" content="#171B22">
<link rel="icon" type="image/png" href="{{ url_for('static', filename='icons/icon-192.png') }}">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/apple-touch-icon.png') }}">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="i.cannal">
<link rel="stylesheet" href="{{ url_for('static', filename='auth.css') }}">
</head>
<body>
  <div class="auth-tela">
    <div class="auth-card">
      <svg class="auth-logo" viewBox="0 0 280 44" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="i.cannal">
        <polygon points="2,0 16,0 32,44 18,44" fill="#88AD36"/>
        <polygon points="25,0 39,0 55,44 41,44" fill="#88AD36"/>
        <text x="72" y="34" font-family="Montserrat, sans-serif" font-weight="900" font-size="34" textLength="204" lengthAdjust="spacing">
          <tspan fill="#A8CC5A">I.</tspan><tspan fill="#FFFFFF">CANNAL</tspan>
        </text>
      </svg>
      <h1>Criar conta no i.cannal</h1>

      {% if erro %}<div class="auth-erro">{{ erro }}</div>{% endif %}

      <form method="POST">
        <div class="campo">
          <label for="nome">Nome</label>
          <input type="text" id="nome" name="nome" value="{{ nome }}" required autofocus>
        </div>
        <div class="campo">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" value="{{ email }}" required>
        </div>
        <div class="campo">
          <label for="cpf">CPF</label>
          <input type="text" id="cpf" name="cpf" value="{{ cpf }}" placeholder="000.000.000-00" required maxlength="14" inputmode="numeric">
        </div>
        <div class="campo">
          <label for="senha">Senha</label>
          <div class="campo-senha-wrapper">
            <input type="password" id="senha" name="senha" required minlength="6">
            <button type="button" class="botao-olho" data-alvo="senha" aria-label="Mostrar senha">
              <svg class="icone-olho-aberto" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="icone-olho-fechado" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a18.5 18.5 0 0 1 5.06-5.94M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 7 11 7a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>
        </div>
        <div class="campo">
          <label for="confirmar">Confirmar senha</label>
          <div class="campo-senha-wrapper">
            <input type="password" id="confirmar" name="confirmar" required minlength="6">
            <button type="button" class="botao-olho" data-alvo="confirmar" aria-label="Mostrar senha">
              <svg class="icone-olho-aberto" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="icone-olho-fechado" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a18.5 18.5 0 0 1 5.06-5.94M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 7 11 7a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>
        </div>
        <button type="submit" class="btn-auth">Criar conta</button>
      </form>

      <div class="auth-link">Já tem conta? <a href="{{ url_for('login') }}">Entrar</a></div>
    </div>
  </div>

  <script>
    document.getElementById('cpf').addEventListener('input', function(e){
      let v = e.target.value.replace(/\D/g, '').slice(0, 11);
      if (v.length > 9) v = v.replace(/(\d{3})(\d{3})(\d{3})(\d{1,2})/, '$1.$2.$3-$4');
      else if (v.length > 6) v = v.replace(/(\d{3})(\d{3})(\d{1,3})/, '$1.$2.$3');
      else if (v.length > 3) v = v.replace(/(\d{3})(\d{1,3})/, '$1.$2');
      e.target.value = v;
    });

    document.querySelectorAll('.botao-olho').forEach(function(botao){
      botao.addEventListener('click', function(){
        const alvo = document.getElementById(botao.dataset.alvo);
        const mostrando = alvo.type === 'text';
        alvo.type = mostrando ? 'password' : 'text';
        botao.classList.toggle('ativo', !mostrando);
        botao.setAttribute('aria-label', mostrando ? 'Mostrar senha' : 'Ocultar senha');
      });
    });
  </script>
<script>
  // Registra o service worker (deixa o site instalável e funcionando como
  // app). Se o navegador não suportar, o site continua funcionando normal —
  // só não fica instalável.
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>

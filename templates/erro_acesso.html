<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>i.cannal · Acesso restrito</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
<meta name="theme-color" content="#171B22">
<link rel="icon" type="image/png" href="{{ url_for('static', filename='icons/icon-192.png') }}">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/apple-touch-icon.png') }}">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="i.cannal">
<link rel="stylesheet" href="{{ url_for('static', filename='auth.css') }}">
</head>
<body>
  <div class="auth-tela">
    <div class="auth-card" style="text-align:center;">
      <svg class="auth-logo" viewBox="0 0 280 44" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="i.cannal">
        <polygon points="2,0 16,0 32,44 18,44" fill="#88AD36"/>
        <polygon points="25,0 39,0 55,44 41,44" fill="#88AD36"/>
        <text x="72" y="34" font-family="Montserrat, sans-serif" font-weight="900" font-size="34" textLength="204" lengthAdjust="spacing">
          <tspan fill="#A8CC5A">I.</tspan><tspan fill="#FFFFFF">CANNAL</tspan>
        </text>
      </svg>
      <h1>Acesso restrito</h1>
      <p style="color:var(--cinza); font-size:14px;">Essa área é só para administradores do i.cannal.</p>
      <a href="{{ url_for('index') }}" class="btn-auth" style="display:block; text-decoration:none; margin-top:12px;">Voltar ao i.cannal</a>
    </div>
  </div>
<script>
  // Registra o service worker (deixa o site instalável e funcionando como
  // app). Se o navegador não suportar, o site continua funcionando normal —
  // só não fica instalável.
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>

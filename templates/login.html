<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>i.cannal · Entrar</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='auth.css') }}">
</head>
<body>
  <div class="auth-tela">
    <div class="auth-card">
      <svg class="auth-logo" viewBox="0 0 280 44" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="i.cannal">
        <polygon points="2,0 16,0 32,44 18,44" fill="#88AD36"/>
        <polygon points="25,0 39,0 55,44 41,44" fill="#88AD36"/>
        <text x="72" y="34" font-family="Montserrat, sans-serif" font-weight="900" font-size="34" textLength="204" lengthAdjust="spacing">
          <tspan fill="#A8CC5A">I.</tspan><tspan fill="#FFFFFF">CANNAL</tspan>
        </text>
      </svg>
      <h1>Entrar no i.cannal</h1>

      {% if erro %}<div class="auth-erro">{{ erro }}</div>{% endif %}

      <form method="POST">
        <div class="campo">
          <label for="cpf">CPF</label>
          <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" required maxlength="14" inputmode="numeric" autofocus>
        </div>
        <div class="campo">
          <label for="senha">Senha</label>
          <div class="campo-senha-wrapper">
            <input type="password" id="senha" name="senha" required>
            <button type="button" class="botao-olho" data-alvo="senha" aria-label="Mostrar senha">
              <svg class="icone-olho-aberto" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="icone-olho-fechado" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a18.5 18.5 0 0 1 5.06-5.94M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 7 11 7a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>
        </div>
        <button type="submit" class="btn-auth">Entrar</button>
      </form>

      <div class="auth-link"><a href="#" id="link-esqueci-senha">Esqueci minha senha</a></div>
      <div class="auth-link">Ainda não tem conta? <a href="{{ url_for('cadastro') }}">Cadastre-se</a></div>
    </div>
  </div>

  <div class="aviso-overlay" id="esqueci-overlay">
    <div class="aviso-card" id="esqueci-card-pedido">
      <p class="aviso-titulo">Esqueci minha senha</p>
      <div class="campo" style="text-align:left;">
        <label for="esqueci-cpf">Confirme seu CPF</label>
        <input type="text" id="esqueci-cpf" placeholder="000.000.000-00" maxlength="14" inputmode="numeric">
      </div>
      <button type="button" id="esqueci-btn-enviar" class="btn-auth">Solicitar redefinição</button>
      <button type="button" id="esqueci-btn-cancelar" class="aviso-btn-cancelar">Cancelar</button>
    </div>
    <div class="aviso-card" id="esqueci-card-confirmacao" style="display:none;">
      <p class="aviso-texto-sucesso">Em breve nossa equipe técnica irá entrar em contato com você.</p>
      <button type="button" id="esqueci-btn-fechar" class="btn-auth">Entendi</button>
    </div>
  </div>

  <script>
    document.getElementById('cpf').addEventListener('input', function(e){
      let v = e.target.value.replace(/\D/g, '').slice(0, 11);
      if (v.length > 9) v = v.replace(/(\d{3})(\d{3})(\d{3})(\d{1,2})/, '$1.$2.$3-$4');
      else if (v.length > 6) v = v.replace(/(\d{3})(\d{3})(\d{1,3})/, '$1.$2.$3');
      else if (v.length > 3) v = v.replace(/(\d{3})(\d{1,3})/, '$1.$2');
      e.target.value = v;
    });

    document.querySelectorAll('.botao-olho').forEach(function(botao){
      botao.addEventListener('click', function(){
        const alvo = document.getElementById(botao.dataset.alvo);
        const mostrando = alvo.type === 'text';
        alvo.type = mostrando ? 'password' : 'text';
        botao.classList.toggle('ativo', !mostrando);
        botao.setAttribute('aria-label', mostrando ? 'Mostrar senha' : 'Ocultar senha');
      });
    });

    // ===== Esqueci minha senha =====
    const esqueciOverlay = document.getElementById('esqueci-overlay');
    const esqueciCardPedido = document.getElementById('esqueci-card-pedido');
    const esqueciCardConfirmacao = document.getElementById('esqueci-card-confirmacao');
    const esqueciCpf = document.getElementById('esqueci-cpf');
    const esqueciBtnEnviar = document.getElementById('esqueci-btn-enviar');

    function mascararCpf(input){
      input.addEventListener('input', function(e){
        let v = e.target.value.replace(/\D/g, '').slice(0, 11);
        if (v.length > 9) v = v.replace(/(\d{3})(\d{3})(\d{3})(\d{1,2})/, '$1.$2.$3-$4');
        else if (v.length > 6) v = v.replace(/(\d{3})(\d{3})(\d{1,3})/, '$1.$2.$3');
        else if (v.length > 3) v = v.replace(/(\d{3})(\d{1,3})/, '$1.$2');
        e.target.value = v;
      });
    }
    mascararCpf(esqueciCpf);

    document.getElementById('link-esqueci-senha').addEventListener('click', function(e){
      e.preventDefault();
      esqueciCardPedido.style.display = 'block';
      esqueciCardConfirmacao.style.display = 'none';
      esqueciCpf.value = document.getElementById('cpf').value || '';
      esqueciOverlay.classList.add('aberto');
    });

    document.getElementById('esqueci-btn-cancelar').addEventListener('click', function(){
      esqueciOverlay.classList.remove('aberto');
    });

    document.getElementById('esqueci-btn-fechar').addEventListener('click', function(){
      esqueciOverlay.classList.remove('aberto');
    });

    esqueciBtnEnviar.addEventListener('click', function(){
      esqueciBtnEnviar.disabled = true;
      esqueciBtnEnviar.textContent = 'Enviando...';
      fetch('/api/esqueci-senha', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ cpf: esqueciCpf.value })
      })
        .then(res => res.json())
        .then(() => {
          esqueciBtnEnviar.disabled = false;
          esqueciBtnEnviar.textContent = 'Solicitar redefinição';
          esqueciCardPedido.style.display = 'none';
          esqueciCardConfirmacao.style.display = 'block';
        })
        .catch(() => {
          esqueciBtnEnviar.disabled = false;
          esqueciBtnEnviar.textContent = 'Solicitar redefinição';
        });
    });
  </script>
</body>
</html>

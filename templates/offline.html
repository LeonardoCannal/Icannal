<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>i.cannal · Sem conexão</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='auth.css') }}">
</head>
<body>
  <div class="auth-tela">
    <div class="auth-card" style="text-align:center;">
      <svg class="auth-logo" viewBox="0 0 280 44" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="i.cannal">
        <polygon points="2,0 16,0 32,44 18,44" fill="#88AD36"/>
        <polygon points="25,0 39,0 55,44 41,44" fill="#88AD36"/>
        <text x="72" y="34" font-family="Montserrat, sans-serif" font-weight="900" font-size="34" textLength="204" lengthAdjust="spacing">
          <tspan fill="#A8CC5A">I.</tspan><tspan fill="#FFFFFF">CANNAL</tspan>
        </text>
      </svg>
      <h1>Sem conexão</h1>
      <p style="color:var(--cinza); font-size:14px; line-height:1.6;">
        Não deu pra falar com o servidor agora. Confira sua internet e tente de novo —
        os dados do painel e da agenda precisam estar sempre atualizados, então
        essa página não funciona sem conexão.
      </p>
      <button type="button" onclick="location.reload()" class="btn-auth" style="margin-top:12px;">Tentar de novo</button>
    </div>
  </div>
</body>
</html>
